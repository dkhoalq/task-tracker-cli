[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "task-cli"
version = "1.0.0"
description = "A simple command-line task tracker"
requires-python = ">=3.10"

[project.scripts]
task-cli = "task_cli:main"

[tool.setuptools]
py-modules = ["task_cli", "task_manager", "storage"]